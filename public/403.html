<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 — Không có quyền | TaskFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .code { font-size: 140px; font-weight: 900; line-height: 1; letter-spacing: -6px; }
    .icon { font-size: 48px; margin-bottom: 12px; }
    .msg { font-size: 15px; color: #555; margin: 12px 0 24px; }
    a {
      display: inline-block;
      padding: 10px 24px;
      border: 2px solid #000;
      background: #000;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: 0.2s;
    }
    a:hover { background: #fff; color: #000; }
  </style>
</head>
<body>
  <div>
    <div class="icon">🔒</div>
    <div class="code">403</div>
    <p class="msg">Bạn không có quyền truy cập trang này.</p>
    <a href="/">Về trang chủ</a>
  </div>
</body>
</html>
